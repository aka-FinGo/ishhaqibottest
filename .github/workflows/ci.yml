name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check ES Modules Syntax
        run: |
          for f in src/*.js src/*/*.js src/*/*/*.js; do node --check "$f" || exit 1; done

      - name: Verify Window Scope Exports
        run: node tests/module-window-export.test.js

      - name: Run Date Tests
        run: node tests/date-parse.test.js
