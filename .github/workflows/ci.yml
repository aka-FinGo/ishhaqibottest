name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check ES Modules Syntax
        run: |
          node --check src/main.js
          node --check src/core/config.js
          node --check src/core/state.js
          node --check src/core/api.js
          node --check src/core/cache.js
          node --check src/components/ui_utils.js

      - name: Run Date Tests
        run: node tests/date-parse.test.js
