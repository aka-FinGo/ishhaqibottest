<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="format-detection" content="telephone=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>AI Chat - Aristokrat Ish Haqi</title>
    
    <link rel="stylesheet" href="style.css?v=1.0.24">
    <link rel="stylesheet" href="components.css?v=1.0.24">
    <link rel="stylesheet" href="ai_chat.css?v=1.0.24">
    <link id="dynamic-theme" rel="stylesheet" href="">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .back-btn { background: none; border: none; font-size: 14px; color: var(--text); cursor: pointer; padding: 5px; opacity: 0.8; }
        .back-btn:hover { opacity: 1; }
    </style>
</head>
<body>
    <div style="padding: 10px 15px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: var(--surface);">
        <button class="back-btn" onclick="window.history.back()">← Orqaga</button>
        <h3 style="margin: 0; font-size: 16px;">💬 AI Chat</h3>
        <div style="width: 60px;"></div>
    </div>
    
    <div id="aiChatWrapper" style="display: none; height: calc(100vh - 50px); flex-direction: column;">
        <div class="card" style="padding:0; overflow:hidden; display:flex; flex-direction:column; flex: 1; border: none; border-radius: 0;">
            <div style="display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid var(--border); flex-shrink:0;">
                <div style="display:flex; align-items:center; gap:10px;">
                    <div style="width:34px; height:34px; background:var(--accent-gradient); border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:18px;">🤖</div>
                    <div>
                        <div style="font-weight:600; font-size:14px; color:var(--cyan-neon);">AI Yordamchi</div>
                        <div id="aiChatScopeLabel" style="font-size:10px; color:var(--text-muted);">Yuklanmoqda...</div>
                    </div>
                </div>
                <button onclick="clearAIChat()" style="background:none; border:1px solid var(--border); border-radius:8px; padding:5px 10px; font-size:11px; color:var(--text-muted); cursor:pointer;">🗑 Tozalash</button>
            </div>
            <div id="aiChatMessages" style="flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px;"></div>
            <div style="padding:10px 12px; border-top:1px solid var(--border); display:flex; gap:8px; align-items:flex-end; flex-shrink:0;">
                <textarea id="aiChatInput" rows="1" placeholder="Savol bering... (Enter - yuborish)" oninput="aiChatInputResize(this)" style="flex:1; resize:none; border:1px solid var(--border); border-radius:12px; padding:10px 14px; font-size:13px; background:var(--surface); color:var(--text); outline:none; line-height:1.4; max-height:120px; overflow-y:auto;"></textarea>
                <button id="aiChatSendBtn" onclick="sendAIChat()" style="width:40px; height:40px; border-radius:12px; background:var(--accent-gradient); border:none; color:#fff; font-size:18px; cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center;">&#9658;</button>
            </div>
        </div>
        <div style="padding: 10px; background: var(--bg);">
            <div style="font-size:11px; color:var(--text-muted); margin-bottom:8px;">Tezkor savollar:</div>
            <div style="display:flex; flex-wrap:wrap; gap:6px;">
                <button class="btn-secondary" style="font-size:11px; padding:5px 10px; margin:0;" onclick="aiQuickAsk('Bu oy umumiy xarajatlar qancha?')">Bu oy xarajatlar</button>
                <button class="btn-secondary" style="font-size:11px; padding:5px 10px; margin:0;" onclick="aiQuickAsk('Eng ko\'p ish qilgan 3 xodim kim?')">Top 3 xodim</button>
                <button class="btn-secondary" style="font-size:11px; padding:5px 10px; margin:0;" onclick="aiQuickAsk('Buyurtma raqamlarida bo\'shliq bormi?')">Raqam bo'shliqlari</button>
                <button class="btn-secondary" style="font-size:11px; padding:5px 10px; margin:0;" onclick="aiQuickAsk('Qisqa moliyaviy hisobot tayyorla')">Moliyaviy hisobot</button>
            </div>
        </div>
    </div>
    
    <div id="loadingOrError" style="padding: 20px; text-align: center; font-size: 14px; color: var(--text-muted); margin-top: 50px;">
        <div class="spinner" style="margin: 0 auto 10px auto;"></div>
        Yuklanmoqda...
    </div>

    <!-- Required Scripts -->
    <script>
        const savedTheme = localStorage.getItem('user_theme');
        if (savedTheme) {
            document.getElementById('dynamic-theme').href = savedTheme;
        }

        // Dummy variables & functions for admin_ai_chat.js to work in isolation
        let myRole = 'User';
        function showToastMsg(msg, isErr) {
            alert(msg);
        }
    </script>
    <script src="config.js?v=1.0.24"></script>
    <script src="admin_ai_chat.js?v=1.0.24"></script>
    <script>
        async function loadAI() {
            try {
                const res = await apiRequest({ action: 'init' });
                if (res && res.success) {
                    if (res.isSuperAdmin) myRole = 'SuperAdmin';
                    else if (res.isAdmin) myRole = 'Admin';
                    else if (res.isDirector || res.isDirektor) myRole = 'Direktor';
                    
                    if (myRole !== 'SuperAdmin' && myRole !== 'Direktor' && myRole !== 'Admin') {
                        document.getElementById('loadingOrError').innerHTML = '❌ Sizga bu sahifani ko\'rish ruxsat etilmagan.';
                        return;
                    }
                    
                    document.getElementById('loadingOrError').style.display = 'none';
                    document.getElementById('aiChatWrapper').style.display = 'flex';
                    
                    const scopeLabel = document.getElementById('aiChatScopeLabel');
                    if (scopeLabel) {
                        const isCompany = myRole === 'SuperAdmin' || myRole === 'Direktor';
                        scopeLabel.textContent = isCompany ? '📊 Kompaniya ma\'lumotlari bilan' : '👤 Faqat o\'z ma\'lumotlarim';
                    }
                    
                    initAIChatArea();
                } else {
                    document.getElementById('loadingOrError').innerHTML = '❌ Xatolik yuz berdi: ' + (res ? res.error : 'Noma\'lum xato');
                }
            } catch(e) {
                document.getElementById('loadingOrError').innerHTML = '❌ Tarmoq xatosi';
                console.error(e);
            }
        }
        
        window.addEventListener('DOMContentLoaded', () => {
            if (window.tg && tg.ready) {
                tg.ready();
                tg.expand();
            }
            loadAI();
        });
    </script>
</body>
</html>
